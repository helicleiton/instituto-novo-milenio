<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Enviar mídia · Instituto Novo Milênio</title>
  <link rel="icon" type="image/png" href="../assets/logo-novo-milenio.png">
  <script>
    /* Atalho para a página de envio de mídias (Apps Script).
       Cole aqui a URL do Web App (termina em /exec), sem "?api=midias". */
    var URL_PAGINA_ENVIO = '';
    if (URL_PAGINA_ENVIO) location.replace(URL_PAGINA_ENVIO);
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 1.5rem; }
    img { width: 88px; height: 88px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.9); margin-bottom: 1.25rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
    p { color: rgba(255,255,255,.75); margin: 0 0 1.25rem; max-width: 360px; }
    a { color: #f59e0b; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/logo-novo-milenio.png" alt="Logo do Instituto Novo Milênio">
    <h1 id="titulo">Abrindo a página de envio…</h1>
    <p id="texto">Se nada acontecer em alguns segundos, <a id="link" href="#">toque aqui</a>.</p>
  </main>
  <script>
    if (URL_PAGINA_ENVIO) {
      document.getElementById('link').href = URL_PAGINA_ENVIO;
    } else {
      document.getElementById('titulo').textContent = 'Página de envio em configuração';
      document.getElementById('texto').innerHTML = 'Em breve será possível enviar fotos e vídeos por aqui. <a href="../">Voltar ao site</a>';
    }
  </script>
</body>
</html>
